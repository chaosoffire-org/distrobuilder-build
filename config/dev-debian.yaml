image:
  distribution: debian
  release: trixie
  architecture: x86_64

mappings:
  architecture_map: debian

source:
  downloader: debootstrap
  url: http://deb.debian.org/debian
  keyserver: keyserver.ubuntu.com
  keys:
    - 0x225629DF75B188BD
    - 0x9904613D4CCE68C6
  variant: minbase

targets:
  lxc:
    create_message: |
      Development Environment (Debian {{ image.release }})
      Pre-installed:
        Docker CE, Go, Rust (+cargo), Zig stable (+zig cc/c++ cross-compiler),
        fnm (Fast Node Manager — run `fnm install --lts` on first login),
        Bun, Python 3 + uv, just,
        Java (Azul Zulu JDK 17/21/25 — default 25), Kotlin,
        clang/llvm + GCC + musl-tools, Oh-My-Zsh
        DX tools: direnv, zoxide, fzf, ripgrep, fd, bat, eza,
                  neovim, tmux (configured), git-delta, lazygit, lazydocker,
                  shellcheck, shfmt, gh
      Login: root (no password) | chaos (password: chaos, sudo NOPASSWD)
      Type: LXC Container

      * Note: Requires "nesting=1" for Docker in LXC
      * Note: Set "swap=0" recommended
      * Note: Switch Java via: update-alternatives --config java
      * Note: Node.js is NOT pre-installed — use fnm:
          fnm install --lts    # install latest LTS
          fnm default lts-latest
  incus:
    vm:
      size: 53687091200
      filesystem: ext4

files:
  - path: /etc/apt/apt.conf.d/99-distrobuilder
    generator: dump
    content: |
      Acquire::Languages "none";
      APT::Install-Recommends "false";
      APT::Install-Suggests "false";
      Acquire::Retries "3";
      Acquire::Parallel "10";

  - path: /etc/systemd/networkd.conf
    generator: dump
    content: |
      [Network]
      # keep classic kernel interface names (eth0, wlan0)
      NamePolicy=kernel

  - path: /etc/locale.gen
    generator: dump
    content: |
      en_US.UTF-8 UTF-8
      zh_TW.UTF-8 UTF-8

  - path: /root/.zshrc
    generator: dump
    mode: 0644
    content: |
      export ZSH="/root/.oh-my-zsh"
      ZSH_THEME="robbyrussell"
      plugins=(git docker systemd zsh-autosuggestions zsh-syntax-highlighting)
      source $ZSH/oh-my-zsh.sh
      export LANG=en_US.UTF-8
      export EDITOR=nvim
      alias ll='ls -lah --color=auto'
      alias grep='grep --color=auto'
      alias vi='nvim'
      alias vim='nvim'
      alias dps='docker ps -a --format "table {{.Names}}\t{{.Image}}\t{{.Status}}"'
      alias dlog='docker logs -f'

      # Zig cross-compiler shortcuts (zig cc / zig c++ as drop-in C/C++ compiler)
      alias zigcc='zig cc'
      alias zigcxx='zig c++'
      alias zigwin='zig cc -target x86_64-windows-gnu'
      alias zigdarwin='zig cc -target aarch64-macos'
      alias zigdarwinx86='zig cc -target x86_64-macos'
      alias zigmac='zig cc -target aarch64-macos'
      alias zigmacx86='zig cc -target x86_64-macos'

      # Go CGO cross-compile helpers — uses zig cc as the C cross-compiler.
      # Usage:  go-cgo-windows-amd64 build ./...
      #         go-cgo-darwin-arm64 build -o app ./...
      #         go-cgo-linux-musl-amd64 build ./...
      # Sets CC, GOOS, GOARCH, CGO_ENABLED=1, then restores env.
      __go_cgo() {
        local _cc="$1" _goos="$2" _goarch="$3" _ldflags="$4"; shift 4
        env CGO_ENABLED=1 CC="$_cc" GOOS="$_goos" GOARCH="$_goarch" CGO_LDFLAGS="$_ldflags" go "$@"
      }
      go-cgo-windows-amd64()  { __go_cgo 'zig cc -target x86_64-windows-gnu'   windows amd64 "-lwldap32 -lntdll" "$@"; }
      go-cgo-darwin-arm64()   { __go_cgo 'zig cc -target aarch64-macos'        darwin  arm64 "" "$@"; }
      go-cgo-darwin-amd64()   { __go_cgo 'zig cc -target x86_64-macos'         darwin  amd64 "" "$@"; }
      go-cgo-linux-gnu-amd64()  { __go_cgo 'zig cc -target x86_64-linux-gnu'   linux   amd64 "" "$@"; }
      go-cgo-linux-gnu-arm64()  { __go_cgo 'zig cc -target aarch64-linux-gnu'  linux   arm64 "" "$@"; }
      go-cgo-linux-musl-amd64() { __go_cgo 'zig cc -target x86_64-linux-musl'  linux   amd64 "" "$@"; }
      go-cgo-linux-musl-arm64() { __go_cgo 'zig cc -target aarch64-linux-musl' linux   arm64 "" "$@"; }

      # Java / Kotlin — default JDK 25; switch via update-alternatives --config java
      export JAVA_HOME=/usr/lib/jvm/zulu25
      export PATH="$JAVA_HOME/bin:/opt/kotlin/bin:$PATH"

      # Rust env (rustup installed at $HOME/.cargo)
      . "$HOME/.cargo/env" 2>/dev/null || true

      # Go
      export PATH="$PATH:/usr/local/go/bin:$HOME/go/bin"

      # Zig (stable release at /opt/zig)
      export PATH="$PATH:/opt/zig"

      # fnm (Fast Node Manager) — Rust binary, ~1ms shell startup.
      # No node version is pre-installed; run `fnm install --lts` on first login.
      # Reads .nvmrc / .node-version automatically via --use-on-cd.
      eval "$(fnm env --shell zsh --use-on-cd --version-file-strategy recursive 2>/dev/null)" || true
      export PATH="$PATH:$HOME/.bun/bin"

      # uv (Python package manager) — installed at $HOME/.local/bin
      export PATH="$HOME/.local/bin:$PATH"

      # Modern path-jumper (replaces cd for frequent dirs)
      eval "$(zoxide init zsh)" 2>/dev/null || true

      # fzf keybindings (Ctrl-R history, Ctrl-T file, Alt-C cd) + completion
      source /usr/share/doc/fzf/examples/key-bindings.zsh 2>/dev/null
      source /usr/share/doc/fzf/examples/completion.zsh 2>/dev/null

      # direnv (auto-load .envrc)
      eval "$(direnv hook zsh)" 2>/dev/null || true

      # Aliases for Debian-renamed binaries (fd-find → fd, bat → batcat)
      # Real symlinks are created in action 6b; aliases are belt-and-suspenders fallback.
      command -v fd      >/dev/null 2>&1 || alias fd='fdfind'
      command -v bat     >/dev/null 2>&1 || alias bat='batcat'
      command -v lazygit >/dev/null 2>&1 && alias lg='lazygit'
      command -v lazydocker >/dev/null 2>&1 && alias lzd='lazydocker'

  - path: /etc/systemd/system/docker-compose@.service
    generator: dump
    mode: 0644
    content: |
      [Unit]
      Description=Docker Compose Service (Instance: %I)
      After=docker.service
      Requires=docker.service

      [Service]
      Type=oneshot
      RemainAfterExit=yes
      ExecStart=/usr/bin/docker compose -f /etc/docker/%I.yaml up -d
      ExecStop=/usr/bin/docker compose -f /etc/docker/%I.yaml down

      [Install]
      WantedBy=multi-user.target

  - path: /etc/sysctl.d/99-dev.conf
    generator: dump
    content: |
      net.ipv4.ip_forward = 1
      net.ipv6.conf.all.forwarding = 1
      fs.inotify.max_user_watches = 524288
      fs.inotify.max_user_instances = 512
      vm.max_map_count = 262144

  - path: /etc/profile.d/dev-env.sh
    generator: dump
    mode: 0644
    content: |
      export LANG=en_US.UTF-8
      export EDITOR=nvim
      export JAVA_HOME=/usr/lib/jvm/zulu25
      export PATH="$JAVA_HOME/bin:/opt/kotlin/bin:$PATH:/usr/local/go/bin:$HOME/go/bin:$HOME/.local/bin:$HOME/.cargo/bin:/opt/zig:$HOME/.bun/bin:/usr/local/bin"

  - path: /etc/systemd/system/serial-getty@ttyS0.service.d/autologin.conf
    types:
      - vm
    generator: dump
    content: |
      [Service]
      ExecStart=
      ExecStart=-/sbin/agetty --autologin root --noclear %I 115200 linux

  - path: /root/.tmux.conf
    generator: dump
    mode: 0644
    content: |
      # --- UI ---
      set  -g default-terminal "tmux-256color"
      set  -ag terminal-overrides ",xterm-256color:RGB"
      set  -g mouse on
      set  -g history-limit 50000
      set  -g base-index 1
      set  -g pane-base-index 1
      set  -g renumber-windows on
      set  -g escape-time 10
      set  -g status-interval 5
      set  -g status-style "bg=default,fg=default"
      set  -g status-left  " #[fg=blue]#S "
      set  -g status-right "#[fg=cyan]%Y-%m-%d %H:%M "
      set  -g window-status-current-style "fg=black,bg=cyan"
      setw -g mode-keys vi

      # --- Keybinds (vi-style) ---
      unbind C-b
      set  -g prefix C-a
      bind C-a send-prefix
      bind r source-file ~/.tmux.conf \; display "tmux reloaded"
      bind | split-window -h -c "#{pane_current_path}"
      bind - split-window -v -c "#{pane_current_path}"
      bind h select-pane -L
      bind j select-pane -D
      bind k select-pane -U
      bind l select-pane -R
      bind -r H resize-pane -L 5
      bind -r J resize-pane -D 5
      bind -r K resize-pane -U 5
      bind -r L resize-pane -R 5

  - path: /etc/gitconfig
    generator: dump
    mode: 0644
    content: |
      [init]
          defaultBranch = main
      [pull]
          rebase = true
      [push]
          default = current
          autoSetupRemote = true
      [core]
          pager = delta
      [interactive]
          diffFilter = delta --color-only
      [delta]
          navigate = true
          side-by-side = true
          line-numbers = true
          syntax-theme = Dracula
      [merge]
          conflictstyle = zdiff3
      [diff]
          colorMoved = default

  - path: /etc/skills/dev-environment/SKILL.md
    generator: dump
    mode: 0644
    content: |
      ---
      name: dev-environment
      description: Quick overview of what's built into this development system. Load this skill when you need to know what tools are available in this enviroment.
      ---

      # dev-environment Overview

      ## Languages
      C/C++ (gcc, clang), Go, Rust, Zig, Python 3, Java (Zulu), Kotlin, Bun.
      Node.js managed via `fnm`.

      ## Cross-Compilation
      - **Go CGO**: shell helpers `go-cgo-<os>-<arch>` in `~/.zshrc` (uses zig cc)
      - **Rust**: `cargo zigbuild` / `cross` (targets pre-added)
      - **C/C++**: `zig cc -target <triple>` (aliases: `zigwin`, `zigdarwin`, `zigdarwinx86`)

      ## LSP Servers
      clangd, gopls, rust-analyzer.

      ## Shell
      zsh + oh-my-zsh. Notable aliases: `vi`/`vim`→nvim, `lg`→lazygit, `lzd`→lazydocker.
      Tools: zoxide (`z`), fzf, direnv, `fd`, `bat`, `rg`.

      ## Docker
      Docker CE + compose plugin. Use `docker compose` (not `docker-compose`).

      ## Python
      Use `uv` (not pip) for venv and package management.

      ## DX Tools
      git (with `delta` pager), lazygit, lazydocker, tmux, gh, just, shellcheck, shfmt.

packages:
  manager: apt
  update: true
  cleanup: true
  repositories:
    - name: sources.list
      url: |-
        deb http://deb.debian.org/debian {{ image.release }} main non-free-firmware
  sets:
    - packages:
        - systemd-sysv
        - dbus
        - openssh-server
        - sudo
        - ca-certificates
        - curl
        - wget
        - gnupg
        - lsb-release
        - procps
        - iproute2
        - iputils-ping
        - iputils-tracepath
        - dnsutils
        - less
        - vim
        - bash-completion
        - zsh
        - git
        - jq
        - tmux
        - htop
        - btop
        - tree
        - unzip
        - xz-utils
        - file
        - rsync
        - locales
        - tzdata
        - man-db
      action: install

    - packages:
        - build-essential
        - make
        - m4
        - pkg-config
        - cmake
        - ninja-build
        - autoconf
        - automake
        - libtool
        - flex
        - bison
        - ccache
        - strace
        - ltrace
        - gdb
        - valgrind
        - clang
        - clang-tools
        - clangd
        - lld
        - lldb
        - llvm
        - libc++-dev
        - libc++abi-dev
        - musl-tools
        - libssl-dev
        - libcurl4-openssl-dev
        - libz-dev
        - libbz2-dev
        - liblzma-dev
        - libsqlite3-dev
        - libxml2-dev
        - libxslt1-dev
        - libffi-dev
        - libreadline-dev
        - libpcre2-dev
        - libgit2-dev
        - perl
      action: install

    - packages:
        - python3
        - python3-pip
        - python3-venv
        - python3-dev
        - python3-full
        - pipx
      action: install

    - packages:
        - ripgrep
        - fd-find
        - fzf
        - bat
        - eza
        - ncdu
        - duf
        - socat
        - netcat-openbsd
        - tcpdump
        - nmap
        - httpie
        - shellcheck
        - shfmt
        - parallel
        - direnv
        - zoxide
        - neovim
